spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Application default values for production & lambda startup
asa.care.product.code=${ASA_CARE_PRODUCT_CODE:dummy-care-product-code}
asa.paid.care.mission.codes=${ASA_PAID_CARE_MISSION_CODES:dummy-paid-care-mission-codes}

casdoor.logout.url=${CASDOOR_LOGOUT_URL:https://casdoor.example.com}
asa.logout.url=${ASA_LOGOUT_URL:https://example.com}

spring.security.oauth2.client.registration.casdoor.clientid=${CASDOOR_CLIENT_ID:dummy}
spring.security.oauth2.client.registration.casdoor.client-id=${CASDOOR_CLIENT_ID:dummy}
spring.security.oauth2.client.registration.casdoor.client-secret=${CASDOOR_CLIENT_SECRET:dummy}
spring.security.oauth2.client.registration.casdoor.provider=casdoor
spring.security.oauth2.client.registration.casdoor.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.casdoor.redirect-uri={baseUrl}/login/oauth2/code/casdoor

spring.security.oauth2.client.provider.casdoor.authorization-uri=${CASDOOR_AUTHORIZATION_URI:https://casdoor.example.com/api/login/oauth/authorize}
spring.security.oauth2.client.provider.casdoor.token-uri=${CASDOOR_TOKEN_URI:https://casdoor.example.com/api/login/oauth/access_token}

ACCOUNTANTS=${ACCOUNTANTS:dummy,dummy2}
MAX_LATENESS_REPORT=${MAX_LATENESS_REPORT:4}
SENSITIVE_WORKERS_CODES=${SENSITIVE_WORKERS_CODES:W-059,W-00}
LOW_REMAINING_DAYS_THRESHOLD=${LOW_REMAINING_DAYS_THRESHOLD:10}
