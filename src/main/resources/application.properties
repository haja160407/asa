spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Disable Spring Session JDBC auto-configuration (Lambda is stateless — session managed by OAuth2/Casdoor)
spring.session.store-type=none

# Application default values for production & lambda startup
asa.care.product.code=${ASA_CARE_PRODUCT_CODE:dummy-care-product-code}
asa.paid.care.mission.codes=${ASA_PAID_CARE_MISSION_CODES:dummy-paid-care-mission-codes}

# Poja-generated beans — fallback values to prevent cold-start crash when env vars not yet set
sentry.dsn=${SENTRY_DSN:https://dummy@sentry.io/0}
sentry.environment=${SENTRY_ENVIRONMENT:preprod}
aws.s3.bucket=${AWS_S3_BUCKET:dummy-bucket}
aws.eventBridge.bus=${AWS_EVENTBRIDGE_BUS:dummy-bus}

casdoor.logout.url=${CASDOOR_LOGOUT_URL:https://casdoor.example.com}
asa.logout.url=${ASA_LOGOUT_URL:https://example.com}

spring.security.oauth2.client.registration.casdoor.clientid=${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_CASDOOR_CLIENTID:${CASDOOR_CLIENT_ID:dummy}}
spring.security.oauth2.client.registration.casdoor.client-id=${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_CASDOOR_CLIENTID:${CASDOOR_CLIENT_ID:dummy}}
spring.security.oauth2.client.registration.casdoor.client-secret=${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_CASDOOR_CLIENTSECRET:${CASDOOR_CLIENT_SECRET:dummy}}
spring.security.oauth2.client.registration.casdoor.provider=casdoor
spring.security.oauth2.client.registration.casdoor.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.casdoor.redirect-uri=${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_CASDOOR_REDIRECTURI:{baseUrl}/login/oauth2/code/casdoor}
spring.security.oauth2.client.registration.casdoor.scope=openid,profile,email

# Provider configured explicitly to avoid issuer-uri OIDC discovery (blocking HTTP call at Lambda cold-start)
spring.security.oauth2.client.provider.casdoor.authorization-uri=${CASDOOR_AUTHORIZATION_URI:https://casdoor.yotech.mg/login/oauth/authorize}
spring.security.oauth2.client.provider.casdoor.token-uri=${CASDOOR_TOKEN_URI:https://casdoor.yotech.mg/api/login/oauth/access_token}
spring.security.oauth2.client.provider.casdoor.user-info-uri=${CASDOOR_USERINFO_URI:https://casdoor.yotech.mg/api/userinfo}
spring.security.oauth2.client.provider.casdoor.jwk-set-uri=${CASDOOR_JWK_SET_URI:https://casdoor.yotech.mg/.well-known/jwks}
spring.security.oauth2.client.provider.casdoor.user-name-attribute=${SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_CASDOOR_USERNAMEATTRIBUTE:email}

ACCOUNTANTS=${ACCOUNTANTS:dummy,dummy2}
MAX_LATENESS_REPORT=${MAX_LATENESS_REPORT:4}
SENSITIVE_WORKERS_CODES=${SENSITIVE_WORKERS_CODES:W-059,W-00}
LOW_REMAINING_DAYS_THRESHOLD=${LOW_REMAINING_DAYS_THRESHOLD:10}
